syntax = "proto3";

// Pas "BattleShip.Grpc" : dans un composant Razor, les using sont générés dans l'espace de noms de la page,
// et "Grpc.Core" s'y résoudrait en "BattleShip.Grpc.Core", qui n'existe pas.
option csharp_namespace = "BattleShip.Protocol";

package battleship;

// Seule la lecture de l'état passe en gRPC : toutes les modifications de partie restent en HTTP.
service GameService {
  rpc GetGame (GetGameRequest) returns (GameState);
}

message GetGameRequest {
  string game_id = 1;
}

// Construit uniquement à partir de GameStateDto côté serveur : même masquage que la réponse HTTP.
message GameState {
  string id = 1;
  int32 version = 2;
  GamePhase phase = 3;
  // optional : hors partie en cours il n'y a ni tour ni gagnant, et l'absence doit rester distincte d'une valeur.
  optional Side current_turn = 4;
  optional Side winner = 5;
  OwnBoard player = 6;
  OpponentBoard opponent = 7;
  GameStatistics statistics = 8;
  // Choisi pendant la preparation : l'ecran de partie doit le retrouver apres un rechargement.
  AiDifficulty difficulty = 9;
  // Fixe pour toute la partie personnalisee ; jamais modifiable apres la creation.
  bool allow_adjacent_ships = 10;
  // Valeurs brutes : le client compare lui-meme la progression a l'intervalle plutot que de
  // recevoir un texte ou un booleen deja mis en forme.
  int32 special_attack_charge_interval = 11;
  int32 player_special_attack_progress = 12;
  int32 computer_special_attack_progress = 13;
}

message Coordinate {
  int32 column = 1;
  int32 row = 2;
}

message CellList {
  repeated Coordinate cells = 1;
}

message OwnBoard {
  int32 width = 1;
  int32 height = 2;
  repeated CellList ships = 3;
  repeated Coordinate misses = 4;
  repeated Coordinate hits = 5;
  // Longueurs qu'il reste à poser pendant la préparation ; vide une fois la partie commencée.
  repeated int32 remaining_ship_lengths = 6;
  // Mes navires que l'ordinateur a coulés.
  repeated CellList sunk_ships = 7;
}

message OpponentBoard {
  int32 width = 1;
  int32 height = 2;
  repeated Coordinate misses = 3;
  repeated Coordinate hits = 4;
  repeated CellList sunk_ships = 5;
}

message GameStatistics {
  int32 total_shots = 1;
  int32 successful_shots = 2;
  int32 missed_shots = 3;
  int32 accuracy_percentage = 4;
  optional int32 duration_seconds = 5;
  repeated ShotHistory history = 6;
}

message ShotHistory {
  Coordinate target = 1;
  ShotOutcome outcome = 2;
}

enum ShotOutcome {
  SHOT_OUTCOME_UNSPECIFIED = 0;
  SHOT_OUTCOME_MISS = 1;
  SHOT_OUTCOME_HIT = 2;
  SHOT_OUTCOME_SUNK = 3;
}

// En proto3, la valeur 0 est celle d'un champ non renseigné : elle ne doit jamais signifier un vrai état.
enum GamePhase {
  GAME_PHASE_UNSPECIFIED = 0;
  GAME_PHASE_SETUP = 1;
  GAME_PHASE_IN_PROGRESS = 2;
  GAME_PHASE_FINISHED = 3;
}

enum AiDifficulty {
  AI_DIFFICULTY_UNSPECIFIED = 0;
  AI_DIFFICULTY_EASY = 1;
  AI_DIFFICULTY_NORMAL = 2;
  AI_DIFFICULTY_HARD = 3;
}

enum Side {
  SIDE_UNSPECIFIED = 0;
  SIDE_PLAYER = 1;
  SIDE_COMPUTER = 2;
}
